<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile</title><style>body{background:#0c1020;color:#f5f6ff;font-family:system-ui;padding:20px}main{max-width:600px;margin:auto;background:#151b30;padding:24px;border-radius:16px}input{display:block;width:100%;padding:11px;margin:6px 0 15px;background:#0c1020;color:white;border:1px solid #303954;border-radius:8px}button{background:#a78bfa;border:0;padding:11px;border-radius:8px;font-weight:bold}.flash{padding:10px;background:#272b42;margin:8px 0}a{color:#d5c9ff}</style></head><body><main><a href="/dashboard">← Dashboard</a><h1>Profile របស់ខ្ញុំ</h1>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% endwith %}
<form method="post" enctype="multipart/form-data"><label>ឈ្មោះបង្ហាញ</label><input name="display_name" value="{{ user.display_name }}" required><p>Username: {{ user.username }} (មិនអាចប្ដូរនៅទីនេះ)</p><label>ABA KHQR របស់ខ្ញុំ (រូបភាពថ្មីនឹងជំនួស QR ចាស់)</label><input type="file" name="aba_qr" accept="image/*">{% if user.aba_qr_url %}<p><a href="{{ user.aba_qr_url }}" target="_blank">មើល QR បច្ចុប្បន្ន</a></p>{% endif %}<hr><h3>ប្ដូរ Password</h3><label>Password ចាស់</label><input type="password" name="old_password" autocomplete="current-password"><label>Password ថ្មី (យ៉ាងតិច 8 តួ)</label><input type="password" name="new_password" minlength="8" autocomplete="new-password"><button>រក្សាទុក</button></form></main></body></html>
