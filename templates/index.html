<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPP WED PREE</title>
<style>
:root{color-scheme:dark;--bg:#070913;--panel:#101426;--line:#202640;--purple:#8b5cf6;--muted:#94a3b8;--green:#10b981}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Khmer",Arial,sans-serif;padding-bottom:50px}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#05070f;position:sticky;top:0;z-index:10}
.header-title{text-align:center;flex:1}
.header-title h2{font-size:16px;margin:0;letter-spacing:0.5px}
.header-title span{font-size:11px;color:var(--muted)}
main{max-width:600px;margin:auto;padding:14px}
.shop-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.shop-info{display:flex;align-items:center;gap:12px}
.shop-avatar{width:42px;height:42px;border-radius:50%;background:#3b82f6;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px}
.shop-text h3{margin:0 0 2px;font-size:15px}
.shop-text p{margin:0;font-size:12px;color:var(--muted)}
.badge-admin{background:#1e1b4b;border:1px solid #4338ca;color:#c7d2fe;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600}
.banner-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.banner-text h4{margin:0 0 4px;font-size:14px}
.banner-text p{margin:0;font-size:11px;color:var(--muted)}
.btn-green{background:var(--green);color:white;border:0;border-radius:12px;padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.btn-original{background:#1e1b4b;border:1px solid #4338ca;color:#93c5fd;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;margin-bottom:14px}
.empty-channel{background:#0d1122;border:1px dashed var(--line);border-radius:16px;padding:35px 20px;text-align:center;color:var(--muted);font-size:13px;margin-bottom:14px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#05070fe6;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 0;z-index:10}
.nav-item{background:none;border:0;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.nav-item span{font-size:18px}
.hidden{display:none!important}
input,textarea,select{width:100%;padding:12px;border-radius:12px;background:#05070f;border:1px solid var(--line);color:white;font:inherit;margin-top:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
button.primary{width:100%;background:#8b5cf6;color:white;border:0;border-radius:12px;padding:12px;font-weight:bold;margin-top:12px;cursor:pointer}
</style>
</head>
<body>
<header>
<button onclick="history.back()" style="background:none;border:0;color:#60a5fa;font-size:14px;cursor:pointer">Close</button>
<div class="header-title">
<h2>SPP WED PREE</h2>
<span>mini app</span>
</div>
<button style="background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer">•••</button>
</header>

<main>
<!-- Shop Profile & Master Badge -->
<div class="shop-card">
<div class="shop-info">
<div class="shop-avatar">P</div>
<div class="shop-text">
<h3 id="shopName">PREE WIE Shop</h3>
<p id="shopUsername">@Preeaiwie_bot</p>
</div>
</div>
<div id="roleBadge" class="badge-admin">👑 Master Admin</div>
</div>

<!-- Channel Upload Banner -->
<div class="banner-box">
<div class="banner-text">
<h4>ចង់បង្កើត Channel Upload រឿង?</h4>
<p>ទិញសេវាកម្មដើម្បីបាន Channel & PIN ផ្ទាល់ខ្លួន</p>
</div>
<button class="btn-green" onclick="alert('មុខងារទិញ Channel')">➕ ទិញ Channel</button>
</div>

<!-- Original Stories Button -->
<div>
<button class="btn-original">👑 រឿងដើម (Original)</button>
</div>

<!-- Empty Channel State -->
<div class="empty-channel">
<div style="font-size:28px;margin-bottom:8px">🎞️</div>
មិនទាន់មានរឿងក្នុង Channel នេះទេ (ទំរនស្ว่าง)
</div>

<!-- Dynamic Panel for adding stories/admin -->
<div id="appContainer"></div>
</main>

<!-- Bottom Navigation Bar -->
<nav class="bottom-nav">
<button class="nav-item" onclick="switchTab('upload')">
<span>🎬</span>ហ្វាងលក់រឿង
</button>
<button class="nav-item" onclick="switchTab('add')">
<span>➕</span>បញ្ចូលរឿងថ្មី
</button>
</nav>

<script>
function switchTab(tab) {
  const container = document.getElementById('appContainer');
  if(tab === 'upload') {
    container.innerHTML = `<div class="panel"><h3>បញ្ជីរឿងរបស់អ្នក</h3><p style="color:var(--muted);font-size:13px">មិនទាន់មានទិន្នន័យរឿងត្រូវបានបង្ហោះទេ។</p></div>`;
  } else if(tab === 'add') {
    container.innerHTML = `
      <div class="panel">
        <h3>បង្ហោះរឿងថ្មី</h3>
        <label>ចំណងជើងរឿង</label>
        <input type="text" placeholder="បញ្ចូលចំណងជើងរឿង...">
        <label>តម្លៃ ($)</label>
        <input type="number" value="1.00">
        <button class="primary" onclick="alert('បានរក្សាទុក')">រក្សាទុក</button>
      </div>`;
  }
}
switchTab('upload');
</script>
</body>
</html>
