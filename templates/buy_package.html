<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ទិញកញ្ចប់</title><style>body{background:#0c1020;color:white;font-family:system-ui;padding:20px}main{max-width:650px;margin:auto;background:#151b30;padding:24px;border-radius:16px}img{max-width:100%;max-height:300px}input{display:block;margin:12px 0}button{background:#a78bfa;color:#100d20;padding:10px;border:0;border-radius:8px;font-weight:bold}a{color:#d5c9ff}</style></head><body><main><a href="/dashboard">← Dashboard</a><h1>ទិញកញ្ចប់ {{ package.title }}</h1><p>{{ package.days }} ថ្ងៃ · ${{ '%.2f'|format(package.price) }}</p><h2>ABA KHQR របស់ Master</h2>{% if master_qr %}<img src="{{ master_qr }}" alt="Master ABA KHQR">{% else %}<p>Master មិនទាន់កំណត់ ABA KHQR។ សូមទាក់ទង Master ឬកំណត់ QR នៅ Profile។</p>{% endif %}<form method="post" enctype="multipart/form-data"><label>បង្កាន់ដៃ ABA</label><input type="file" name="receipt" accept="image/*" required><button>ផ្ញើទៅ Master</button></form></main></body></html>
