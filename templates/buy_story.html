<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ទិញរឿង</title><style>body{background:#0c1020;color:white;font-family:system-ui;padding:20px}main{max-width:650px;margin:auto;background:#151b30;padding:24px;border-radius:16px}img{max-width:100%;max-height:300px}input{display:block;margin:12px 0}button,.btn{background:#a78bfa;color:#100d20;padding:10px;border:0;border-radius:8px;font-weight:bold}a{color:#d5c9ff}</style></head><body><main><a href="/story/{{ story.id }}">← ត្រឡប់ទៅរឿង</a><h1>ទិញ៖ {{ story.title }}</h1><p>តម្លៃ៖ ${{ '%.2f'|format(story.price) }}</p><h2>ABA KHQR របស់ម្ចាស់រឿង</h2>{% if story.seller_qr %}<img src="{{ story.seller_qr }}" alt="ABA KHQR">{% else %}<p>ម្ចាស់រឿងមិនទាន់ដាក់ ABA KHQR ទេ។ សូមទាក់ទងម្ចាស់រឿង។</p>{% endif %}<p>សូមបង់ប្រាក់តាម QR ហើយផ្ទុករូបបង្កាន់ដៃខាងក្រោម។</p><form method="post" enctype="multipart/form-data"><label>បង្កាន់ដៃ ABA</label><input type="file" name="receipt" accept="image/*" required><button>ផ្ញើបង្កាន់ដៃ</button></form></main></body></html>
