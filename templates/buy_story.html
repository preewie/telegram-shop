<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ទិញរឿង</title><style>
:root{color-scheme:dark;--bg:#090d19;--panel:#131b2e;--card:#1a233d;--muted:#94a3b8;--accent:#8b5cf6;--border:#2a3655;--text:#f8fafc}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;margin:0;padding:20px;display:flex;align-items:center;justify-content:center;min-height:100vh}
main{width:100%;max-width:480px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:24px;text-align:center}
img{max-width:100%;max-height:260px;border-radius:12px;margin:12px 0;border:1px solid var(--border)}
input{display:block;width:100%;padding:10px;margin:10px 0;background:var(--card);color:#fff;border:1px solid var(--border);border-radius:8px}
button{background:var(--accent);color:#fff;border:0;padding:12px;border-radius:10px;font-weight:bold;width:100%;cursor:pointer;margin-top:10px}
a{color:#c4b5fd;text-decoration:none}
</style></head><body><main>
<a href="/story/{{ story.id }}" style="display:block;text-align:left;">← ត្រឡប់ក្រោយ</a>
<h1>ទិញរឿង៖ {{ story.title }}</h1>
<p style="font-size:1.2rem;font-weight:bold;color:#34d399;">តម្លៃ៖ ${{ '%.2f'|format(story.price) }}</p>
<h3 style="font-size:1rem;margin-top:16px;">ABA KHQR របស់ម្ចាស់រឿង</h3>
{% if story.seller_qr %}
  <img src="{{ story.seller_qr }}" alt="ABA KHQR">
{% else %}
  <p class="muted">ម្ចាស់រឿងមិនទាន់ដាក់ ABA KHQR ទេ។</p>
{% endif %}
<p class="muted" style="font-size:0.85rem;">សូមស្កេនបង់ប្រាក់តាម QR ខាងលើ រួចផ្ទុករូបបង្កាន់ដៃខាងក្រោម។</p>
<form method="post" enctype="multipart/form-data">
  <input type="file" name="receipt" accept="image/*" required>
  <button>ផ្ញើបង្កាន់ដៃជូនម្ចាស់រឿង</button>
</form>
</main></body></html>
