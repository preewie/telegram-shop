<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Master បន្ថែមរឿង</title><style>body{background:#0c1020;color:white;font-family:system-ui;padding:20px}main{max-width:650px;margin:auto;background:#151b30;padding:24px;border-radius:16px}input,textarea,select{display:block;width:100%;padding:11px;margin:6px 0 15px;background:#0c1020;color:white;border:1px solid #303954;border-radius:8px}button{background:#a78bfa;border:0;padding:11px;border-radius:8px;font-weight:bold}a{color:#d5c9ff}</style></head><body><main><a href="/dashboard">← Dashboard</a><h1>Master បន្ថែមរឿង</h1><p>ជ្រើសម្ចាស់រឿង។ វីដេអូត្រូវបានរក្សាទុកតាម folder ម្ចាស់រឿង ហើយទិន្នន័យ owner_id ដាច់ដោយឡែក។</p><form method="post" enctype="multipart/form-data"><label>ម្ចាស់រឿង</label><select name="owner_id">{% for o in owners %}<option value="{{ o.id }}">{{ o.display_name }} (@{{ o.username }}) — {{ o.role }}</option>{% endfor %}</select><label>ចំណងជើង</label><input name="title" required><label>ពិពណ៌នា</label><textarea name="description"></textarea><label>តម្លៃ USD</label><input name="price" type="number" min="0" step=".01" required><label>Poster</label><input name="poster" type="file" accept="image/*"><label>វីដេអូ</label><input name="video" type="file" accept="video/*" required><button>រក្សាទុករឿង</button></form></main></body></html>
