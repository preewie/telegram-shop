<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PREE WIE STUDIO - បង្ហោះរឿង</title><style>
:root{color-scheme:dark;--bg:#090d19;--panel:#131b2e;--card:#1a233d;--muted:#94a3b8;--accent:#8b5cf6;--border:#2a3655;--text:#f8fafc}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;margin:0;padding:20px}
main{max-width:600px;margin:auto;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:24px}
a{color:#c4b5fd;text-decoration:none}
h1{margin:4px 0 8px;font-size:1.5rem}
label{display:block;margin:12px 0 6px;font-size:0.9rem;color:var(--muted);font-weight:600}
input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:#fff;font-size:0.95rem;outline:none}
button{background:var(--accent);color:#fff;border:0;padding:14px;border-radius:12px;font-weight:bold;width:100%;cursor:pointer;font-size:1rem;margin-top:20px}
.flash{padding:12px;background:#1e293b;border-left:4px solid var(--accent);border-radius:8px;margin-bottom:14px;font-size:0.9rem}
.badge{background:#8b5cf633;color:#c4b5fd;padding:4px 10px;border-radius:20px;font-size:0.75rem;font-weight:700}
</style></head><body><main>
<a href="/dashboard">← Dashboard</a>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;">
  <h1>PREE WIE STUDIO</h1>
  <span class="badge">Client Streaming App</span>
</div>
<p class="muted" style="margin-bottom:20px;">បង្ហោះរឿងរបស់អ្នក និងកំណត់តម្លៃសម្រាប់អ្នកទិញ (Default $1.00)។</p>

{% with messages=get_flashed_messages(with_categories=true) %}
  {% for category,message in messages %}<div class="flash">{{ message }}</div>{% endfor %}
{% endwith %}

<form method="post" enctype="multipart/form-data">
  <label>ចំណងជើងរឿង</label>
  <input name="title" required maxlength="200" placeholder="បញ្ចូលចំណងជើងរឿង...">
  
  <label>សេចក្ដីពិពណ៌នា</label>
  <textarea name="description" rows="4" placeholder="សរសេរព័ត៌មានលម្អិតអំពីเนื้อរឿង..."></textarea>
  
  <label>តម្លៃរឿង (USD) - លំនាំដើម $1.00</label>
  <input name="price" type="number" min="0" step=".01" value="1.00" required>
  
  <label>Poster រឿង (រូបភាព Preview)</label>
  <input name="poster" type="file" accept="image/*">
  
  <label>វីដេអូរឿង (Video Streaming)</label>
  <input name="video" type="file" accept="video/*" required>
  
  <button>+ បង្ហោះរឿង និងរក្សាទុក</button>
</form>
</main></body></html>
