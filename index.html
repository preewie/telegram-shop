<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ហាងលក់រឿង - Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; padding: 15px; margin: 0; }
        .card { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #334155; }
        .price { color: #38bdf8; font-weight: bold; font-size: 18px; margin: 8px 0; }
        .btn { background: #2563eb; color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h2>🎬 ហាងលក់រឿង (@Preeaiwie_bot)</h2>
    <div class="card">
        <h3>រឿងភាគពិសេស (ដាច់ចប់)</h3>
        <div class="price">$2.00</div>
        <button class="btn" onclick="buy()">🛒 ទិញឥឡូវនេះ</button>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        function buy() {
            tg.sendData(JSON.stringify({ item: "រឿងភាគពិសេស", price: "$2.00" }));
            alert("បានផ្ញើការបញ្ជាទិញទៅកាន់ @Preeaiwie_bot រួចរាល់!");
        }
    </script>
</body>
</html>
