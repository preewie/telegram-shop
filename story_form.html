<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>បង្ហោះរឿង</title><style>body{background:#0c1020;color:white;font-family:system-ui;padding:20px}main{max-width:650px;margin:auto;background:#151b30;padding:24px;border-radius:16px}input,textarea{display:block;width:100%;padding:11px;margin:6px 0 15px;background:#0c1020;color:white;border:1px solid #303954;border-radius:8px}button{background:#a78bfa;border:0;padding:11px;border-radius:8px;font-weight:bold}.flash{padding:10px;background:#272b42}a{color:#d5c9ff}</style></head><body><main><a href="/dashboard">← Dashboard</a><h1>បង្ហោះរឿងថ្មី</h1>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% endwith %}
<form method="post" enctype="multipart/form-data"><label>ចំណងជើង</label><input name="title" required maxlength="200"><label>សេចក្ដីពិពណ៌នា</label><textarea name="description" rows="4"></textarea><label>តម្លៃរឿង (USD)</label><input name="price" type="number" min="0" step=".01" required><label>Poster (ជាជម្រើស)</label><input name="poster" type="file" accept="image/*"><label>វីដេអូ (ចាំបាច់)</label><input name="video" type="file" accept="video/*" required><button>បង្ហោះរឿង</button></form></main></body></html>
